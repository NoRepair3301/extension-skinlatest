<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Skinly AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1445"/>
      <stop offset="1" stop-color="#3d2377"/>
    </linearGradient>
    <radialGradient id="glow" cx="70" cy="58" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c58bff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#c58bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#f1e8ff"/>
      <stop offset="1" stop-color="#cdb9ff"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb4e2"/>
      <stop offset=".5" stop-color="#d7b6ff"/>
      <stop offset="1" stop-color="#8ef5ea"/>
    </linearGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7ac6"/>
      <stop offset="1" stop-color="#8f7bff"/>
    </linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ef0f0"/>
      <stop offset="1" stop-color="#9f86ff"/>
    </linearGradient>
    <linearGradient id="m3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd2a1"/>
      <stop offset="1" stop-color="#ff8fcf"/>
    </linearGradient>
    <radialGradient id="spark" cx="86" cy="12" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="128" height="128" rx="30"/></clipPath>
    <clipPath id="hornclip"><path d="M63 43L86 12L73 48Z"/></clipPath>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <rect width="128" height="128" rx="30" fill="url(#glow)"/>
  <g clip-path="url(#card)">
  <!-- mane -->
  <path d="M60 36C36 30 18 52 26 78C30 92 22 106 12 122" fill="none" stroke="url(#m3)" stroke-width="7" stroke-linecap="round" opacity=".9"/>
  <path d="M58 40C34 40 22 62 31 84C35 95 31 108 24 122" fill="none" stroke="url(#m2)" stroke-width="9" stroke-linecap="round"/>
  <path d="M62 44C42 48 36 68 44 88C47 97 45 108 41 120" fill="none" stroke="url(#m1)" stroke-width="10" stroke-linecap="round"/>
  <!-- ear -->
  <path d="M51 42L56 25L66 41Z" fill="url(#head)"/>
  <path d="M55 39L57 31L61 39Z" fill="#ffc2e6"/>
  <!-- head and neck -->
  <path d="M56 41C68 42 78 56 89 71C95 79 91 88 83 88C77 88 73 88 70 92C66 98 67 112 66 132L45 132C43 90 46 54 56 41Z" fill="url(#head)"/>
  <!-- horn -->
  <path d="M63 43L86 12L73 48Z" fill="url(#horn)"/>
  <g clip-path="url(#hornclip)" stroke="#fff" stroke-opacity=".6" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M62 44L77 49"/>
    <path d="M66 38L81 42"/>
    <path d="M70 32L83 35"/>
    <path d="M75 25L85 27"/>
  </g>
  <!-- face -->
  <path d="M67 60L65.5 57.5M72 59.6L71.6 56.6M77 60.4L78.2 57.7" stroke="#3a2a6a" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M68 62Q73 67 79 62" fill="none" stroke="#3a2a6a" stroke-width="2.6" stroke-linecap="round"/>
  <ellipse cx="73" cy="73" rx="5" ry="3.2" fill="#ffb3d9" opacity=".75"/>
  <circle cx="87" cy="77" r="1.6" fill="#9a7fcf"/>
  <path d="M78 85Q82 87 85 84" fill="none" stroke="#9a7fcf" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <!-- sparkles -->
  <circle cx="86" cy="12" r="14" fill="url(#spark)"/>
  <path d="M86 2L88.4 9.6L96 12L88.4 14.4L86 22L83.6 14.4L76 12L83.6 9.6Z" fill="#fff"/>
  <path d="M104 40L105.6 44.4L110 46L105.6 47.6L104 52L102.4 47.6L98 46L102.4 44.4Z" fill="#ffd6f0"/>
  <path d="M22 28L23.3 31.7L27 33L23.3 34.3L22 38L20.7 34.3L17 33L20.7 31.7Z" fill="#c9f7ff"/>
  <circle cx="108" cy="82" r="2" fill="#fff" opacity=".8"/>
  <circle cx="14" cy="60" r="1.6" fill="#fff" opacity=".7"/>
</svg>
